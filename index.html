<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting...</title>
<script>
(function () {
  var locales = ['en', 'ko', 'ja', 'zh', 'es', 'fr', 'de', 'pt'];
  var cookie = document.cookie.match(/(?:^|; )NEXT_LOCALE=([^;]+)/);
  var pick = cookie && locales.indexOf(cookie[1]) > -1 ? cookie[1] : null;
  var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (var i = 0; i < langs.length && !pick; i++) {
    var tag = String(langs[i]).toLowerCase();
    var base = tag.split('-')[0];
    if (locales.indexOf(tag) > -1) pick = tag;
    else if (locales.indexOf(base) > -1) pick = base;
  }
  var dir = location.pathname.replace(/[^/]*$/, '');
  location.replace(dir + (pick || 'en') + '/' + location.hash);
})();
</script>
</head>
<body style="background:#09090b;color:#fafafa;font-family:system-ui,sans-serif">
<noscript><p><a href="en/">English</a> · <a href="ko/">한국어</a> · <a href="ja/">日本語</a> · <a href="zh/">简体中文</a> · <a href="es/">Español</a> · <a href="fr/">Français</a> · <a href="de/">Deutsch</a> · <a href="pt/">Português</a></p></noscript>
</body>
</html>
